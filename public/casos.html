<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Casos — Mapa de Ayuda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="/coss.css" rel="stylesheet" />
<style>
  button { margin: .5rem .3rem 0 0; }
  a.contact { margin-right: .6rem; }
  h2 { margin: 1.4rem 0 .2rem; }
</style>
</head>
<body class="page">
<h1>Casos verificados <span class="badge">vista para organizaciones acreditadas</span></h1>
<p class="meta">Esta vista incluye datos de contacto y ubicación precisa. Por favor no comparta esta información fuera de su organización.</p>
<p style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><input class="input input-inline" id="token" placeholder="Token de organización" type="password" style="width:16rem" /> <button class="btn btn-primary" style="margin:0" onclick="save()">Entrar</button>
<a class="muted" style="font-size:.8125rem" href="/api/feed?format=csv" download>Descargar CSV público</a></p>
<div id="list"></div>
<script>
const $ = (s) => document.querySelector(s);
function save() { localStorage.responderToken = $("#token").value; load(); }
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", authorization: "Bearer " + (localStorage.responderToken ?? ""), ...opts.headers } });
  if (res.status === 401) { $("#list").innerHTML = "<p>Token inválido.</p>"; throw new Error("401"); }
  return res.json();
}
async function act(id, action) {
  await api("/api/responder/action", { method: "POST", body: JSON.stringify({ id, action }) });
  load();
}
const card = (r) => `
  <div class="card u${r.urgency}">
    <strong>#${r.id} · ${r.need_type} · urgencia ${r.urgency}</strong>
    <span class="meta"> · ${r.channel}${r.source_org ? " (" + r.source_org + ")" : ""} · ${r.created_at}</span><br>
    ${r.description ?? ""}<br>
    <span class="meta">📍 ${r.muni_name ?? "sin municipio"}${r.location_detail ? " · " + r.location_detail : ""}${r.location_raw ? " · dijo: “" + r.location_raw + "”" : ""}
    · 👥 ${r.households} hogares · +${r.confirmations} confirmaciones</span><br>
    ${r.contact ? `☎ <a class="contact" href="tel:${r.contact}">${r.contact}</a><a class="contact" href="https://wa.me/${String(r.contact).replace(/\D/g, "")}" target="_blank">WhatsApp</a>` : `<span class="meta">sin contacto</span>`}
    ${r.status === "verified"
      ? `<button class="btn btn-warning" onclick="act(${r.id},'attend')">Tomar el caso</button>`
      : `<button class="btn btn-success" onclick="act(${r.id},'resolve')">Marcar resuelto</button>`}
  </div>`;
async function load() {
  if (!localStorage.responderToken) return;
  const rows = await api("/api/responder/requests");
  const attending = rows.filter((r) => r.status === "attending");
  const verified = rows.filter((r) => r.status === "verified");
  $("#list").innerHTML =
    (rows.length === 0 ? "<p>No hay casos activos.</p>" : "") +
    (attending.length ? `<h2>En atención <span class="count">(${attending.length})</span></h2>` + attending.map(card).join("") : "") +
    (verified.length ? `<h2>Por atender <span class="count">(${verified.length})</span></h2>` + verified.map(card).join("") : "");
}
load();
setInterval(load, 30_000);
</script>
</body>
</html>
