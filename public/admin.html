<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administración — Mapa de Ayuda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="/coss.css" rel="stylesheet" />
<style>
  table { width: 100%; border-collapse: collapse; font-size: .8125rem; margin-top: .5rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted-foreground); font-weight: 500; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .token-box { background: var(--muted); border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: .6rem .8rem; margin-top: .5rem; font-family: ui-monospace, monospace; font-size: .8125rem; word-break: break-all; }
  .off { color: var(--muted-foreground); text-decoration: line-through; }
</style>
</head>
<body class="page">
<h1>Administración <span class="badge">usuarios y auditoría</span></h1>
<p style="display:flex;gap:.5rem;align-items:center"><input class="input input-inline" id="token" placeholder="Token de administrador" type="password" style="width:16rem" /> <button id="enter" class="btn btn-primary" style="margin:0">Entrar</button></p>

<h2 style="margin-top:1.5rem">Usuarios</h2>
<div class="row" style="margin-top:.5rem">
  <input class="input input-inline" id="u_name" placeholder="Nombre (persona u organización)" style="width:16rem" />
  <select class="input input-inline" id="u_role">
    <option value="mod">Moderador</option>
    <option value="responder">Organización (responder)</option>
    <option value="admin">Administrador</option>
  </select>
  <button id="createUser" class="btn btn-primary" style="margin:0">Crear usuario</button>
</div>
<div id="newtoken"></div>
<div id="users"></div>

<h2 style="margin-top:1.75rem">Líderes comunitarios</h2>
<p class="meta" style="margin-top:.25rem">Cada líder recibe un enlace propio para enviar solicitudes verificadas. La cédula se guarda cifrada (hash); solo se muestran los últimos 3 dígitos.</p>
<div class="row" style="margin-top:.5rem">
  <input class="input input-inline" id="ld_name" placeholder="Nombre del líder" style="width:14rem" />
  <input class="input input-inline" id="ld_cedula" placeholder="Cédula" inputmode="numeric" style="width:9rem" />
  <input class="input input-inline" id="ld_phone" placeholder="Teléfono (opcional)" style="width:10rem" />
  <input class="input input-inline" id="ld_muni" placeholder="Cód. DANE (opcional)" style="width:10rem" />
  <button id="createLeader" class="btn btn-primary" style="margin:0">Registrar líder</button>
</div>
<div id="newlink"></div>
<div id="leaders"></div>

<h2 style="margin-top:1.75rem">Registro de actividad</h2>
<div class="row" style="margin-top:.5rem">
  <input class="input input-inline" id="l_actor" placeholder="Filtrar por actor" style="width:12rem" />
  <input class="input input-inline" id="l_req" placeholder="# caso" style="width:7rem" />
  <button id="filterLog" class="btn" style="margin:0">Filtrar</button>
</div>
<div id="log"></div>

<script src="/onboarding.js"></script>
<script src="/admin.js"></script>
<script src="/feedback.js" defer></script>
</body>
</html>
