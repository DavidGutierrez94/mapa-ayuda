<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pedir ayuda — Mapa de Ayuda</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="/coss.css" rel="stylesheet" />
</head>
<body class="page-narrow">
<h1>Pedir ayuda <span class="badge badge-destructive">Terremoto Chocó 2026</span></h1>
<p>También puedes escribirnos por <strong>WhatsApp o SMS</strong>, los números están en la página principal. Puedes marcar varias necesidades: registraremos una solicitud por cada una.</p>
<style>
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin-top: .375rem; }
  .check { display: flex; align-items: center; gap: .5rem; border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px); padding: .5rem .6rem; font-weight: 400; font-size: .9rem; cursor: pointer; box-shadow: var(--shadow-xs); }
  .check:has(:checked) { border-color: var(--ring); background: var(--muted); }
  .check input { accent-color: var(--primary); margin: 0; }
</style>
<div id="leaderBox" hidden style="border:1px solid #bbf7d0;background:#f0fdf4;border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.75rem">
  <strong>✓ Enlace de líder comunitario</strong>
  <p class="hint" id="leaderName" style="margin-top:.25rem"></p>
  <label class="label" style="margin-top:.5rem">Su cédula (para confirmar identidad)
    <input class="input" id="cedula" inputmode="numeric" placeholder="Solo números" />
    <p class="hint">Se usa únicamente para verificar que usted es el líder registrado. No se almacena ni se publica.</p>
  </label>
</div>
<form id="f">
  <span class="label">¿Qué se necesita? <span class="hint" style="display:inline">(marca todas las que apliquen)</span></span>
  <div class="checks">
    <label class="check"><input type="checkbox" name="need_types" value="agua" /> Agua</label>
    <label class="check"><input type="checkbox" name="need_types" value="alimentos" /> Alimentos</label>
    <label class="check"><input type="checkbox" name="need_types" value="medico" /> Atención médica</label>
    <label class="check"><input type="checkbox" name="need_types" value="rescate" /> Rescate</label>
    <label class="check"><input type="checkbox" name="need_types" value="techo" /> Techo / albergue</label>
    <label class="check"><input type="checkbox" name="need_types" value="otro" /> Otra</label>
  </div>
  <label class="label">¿Qué tan urgente?
    <select class="input" name="urgency">
      <option value="1">Vida en riesgo ahora</option>
      <option value="2" selected>Urgente (horas)</option>
      <option value="3">Necesidad sostenida (días)</option>
    </select>
  </label>
  <label class="label">Municipio
    <input class="input" name="muni_name" list="munis" required placeholder="Escribe para buscar tu municipio" />
    <datalist id="munis"></datalist>
  </label>
  <label class="label">Vereda / barrio / dirección
    <input class="input" name="detail" placeholder="Solo lo ven los organismos de ayuda" />
    <p class="hint">Este dato NO aparece en el mapa público.</p>
  </label>
  <label class="label">¿Cuántas familias afectadas?
    <input class="input" name="households" type="number" min="1" value="1" />
  </label>
  <label class="label">Describe la situación
    <textarea class="input" name="description" rows="3" maxlength="2000"></textarea>
  </label>
  <label class="label">Teléfono de contacto
    <input class="input" name="contact" type="tel" placeholder="Para que los organismos te contacten" />
    <p class="hint">Solo lo ven los organismos acreditados, nunca es público.</p>
  </label>
  <div id="ts"></div>
  <button class="btn btn-destructive btn-block" style="margin-top:1.25rem" type="submit">Enviar solicitud</button>
  <div class="err" id="err"></div>
</form>
<div class="alert-success" id="ok" hidden></div>
<script>
const leaderToken = new URLSearchParams(location.search).get("lider");
if (leaderToken) {
  fetch("/api/leader-check?token=" + encodeURIComponent(leaderToken)).then(r => r.json()).then(d => {
    if (d.ok) {
      document.getElementById("leaderBox").hidden = false;
      document.getElementById("leaderName").textContent = "Hola " + d.name + ". Sus reportes llegarán marcados como reporte de líder verificado.";
    }
  });
}
fetch("/api/municipios").then(r => r.json()).then(list => {
  document.getElementById("munis").innerHTML = list.map(m => `<option value="${m.name} (${m.dept})"></option>`).join("");
});
let sitekey = null;
fetch("/api/config").then(r => r.json()).then(c => {
  sitekey = c.turnstile_sitekey;
  if (sitekey && window.turnstile) turnstile.render("#ts", { sitekey });
  else if (sitekey) window.onloadTurnstileCallback = () => turnstile.render("#ts", { sitekey });
});
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  body.need_types = [...e.target.querySelectorAll('input[name="need_types"]:checked')].map((i) => i.value);
  if (body.need_types.length === 0) {
    document.getElementById("err").textContent = "Marca al menos una necesidad.";
    return;
  }
  body.urgency = +body.urgency; body.households = +body.households;
  if (leaderToken && !document.getElementById("leaderBox").hidden) {
    body.leader_token = leaderToken;
    body.cedula = document.getElementById("cedula").value.trim();
    if (!body.cedula) { document.getElementById("err").textContent = "Escribe tu cédula para confirmar identidad."; return; }
  }
  if (sitekey) body.turnstile_token = e.target.querySelector('[name="cf-turnstile-response"]')?.value;
  const res = await fetch("/api/web-intake", {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (res.ok) {
    e.target.hidden = true;
    const ok = document.getElementById("ok");
    ok.hidden = false;
    const many = (data.ids?.length ?? 1) > 1;
    const ids = (data.ids ?? [data.id]).map((i) => "#" + i).join(", ");
    ok.innerHTML = `<strong>✔ ${many ? "Solicitudes" : "Solicitud"} ${ids} registrada${many ? "s" : ""}.</strong><br>Un moderador ${many ? "las" : "la"} verificará y aparecerá${many ? "n" : ""} en el <a href="/">mapa público</a>. Comparte esta página con quien lo necesite.`;
  } else {
    document.getElementById("err").textContent = data.error ?? "Error, intenta de nuevo.";
  }
};
</script>
</body>
</html>
