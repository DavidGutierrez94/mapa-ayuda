<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Informes — Mapa de Ayuda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="/coss.css" rel="stylesheet" />
<style>
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .6rem; margin-top: 1rem; }
  .tile { border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem .9rem; background: var(--card); box-shadow: var(--shadow-xs); }
  .tile .v { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
  .tile .l { font-size: .8125rem; color: var(--muted-foreground); margin-top: .1rem; }
  .chart-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--card); box-shadow: var(--shadow-xs); margin-top: 1rem; }
  .chart-card h2 { margin: 0 0 .75rem; }
  .hbar-row { display: grid; grid-template-columns: 9rem 1fr 3rem; gap: .6rem; align-items: center; margin: .35rem 0; font-size: .8125rem; }
  .hbar-row .lbl { color: var(--muted-foreground); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-row .bar { height: 14px; border-radius: 0 4px 4px 0; background: #2563eb; min-width: 2px; }
  .hbar-row .val { font-weight: 500; }
  svg text { font-family: var(--font-sans); }
  table { width: 100%; border-collapse: collapse; font-size: .8125rem; margin-top: .5rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted-foreground); font-weight: 500; }
  details summary { cursor: pointer; font-size: .8125rem; color: var(--muted-foreground); margin-top: .5rem; }
  @media print { .no-print { display: none !important; } body { max-width: 100%; } .chart-card, .tile { box-shadow: none; } }
</style>
</head>
<body class="page">
<h1>Informe de situación <span class="badge">Mapa de Ayuda · Chocó 2026</span></h1>
<p class="no-print" style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
  <input class="input input-inline" id="token" placeholder="Token (mod / admin / organización)" type="password" style="width:16rem" />
  <button id="enter" class="btn btn-primary" style="margin:0">Entrar</button>
  <select class="input input-inline" id="days">
    <option value="7">Últimos 7 días</option>
    <option value="14">Últimos 14 días</option>
    <option value="30" selected>Últimos 30 días</option>
    <option value="90">Últimos 90 días</option>
    <option value="365">Todo</option>
  </select>
  <button id="print" class="btn" style="margin:0">Imprimir / PDF</button>
</p>
<p class="meta" id="generated"></p>
<div id="report"></div>

<script src="/informes.js"></script>
<script src="/feedback.js" defer></script>
</body>
</html>
