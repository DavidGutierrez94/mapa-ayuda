<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moderación — Mapa de Ayuda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="/coss.css" rel="stylesheet" />
<style>
  button { margin: .5rem .3rem 0 0; }
  input.muni { width: 11rem; display: inline-block; margin: .5rem .3rem 0 0; }
</style>
</head>
<body class="page">
<h1>Cola de moderación</h1>
<p style="display:flex;gap:.5rem;align-items:center"><input class="input input-inline" id="token" placeholder="Token de moderador" type="password" style="width:16rem" /> <button class="btn btn-primary" style="margin:0" onclick="save()">Entrar</button></p>
<div id="list"></div>
<script>
const $ = (s) => document.querySelector(s);
function save() { localStorage.modToken = $("#token").value; load(); }
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", authorization: "Bearer " + (localStorage.modToken ?? ""), ...opts.headers } });
  if (res.status === 401) { $("#list").innerHTML = "<p>Token inválido.</p>"; throw new Error("401"); }
  return res.json();
}
async function act(id, action, muniInputId) {
  const muni_code = muniInputId ? $("#" + muniInputId).value.trim() : "";
  await api("/api/mod/action", { method: "POST", body: JSON.stringify({ id, action, ...(muni_code && { muni_code }) }) });
  load();
}
async function load() {
  if (!localStorage.modToken) return;
  const rows = await api("/api/mod/queue");
  $("#list").innerHTML = rows.length === 0 ? "<p>✔ Cola vacía.</p>" : rows.map(r => `
    <div class="card u${r.urgency}">
      <strong>#${r.id} · ${r.need_type} · urgencia ${r.urgency}</strong>
      <span class="meta"> · ${r.channel}${r.source_org ? " (" + r.source_org + ")" : ""} · ${r.created_at}</span><br>
      ${r.description ?? ""}<br>
      <span class="meta">📍 ${r.muni_name ?? "⚠ sin municipio"} ${r.location_raw ? "· dijo: “" + r.location_raw + "”" : ""} ${r.location_detail ? "· detalle: " + r.location_detail : ""}
      · 👥 ${r.households} hogares · +${r.confirmations} confirmaciones · ☎ ${r.contact ?? "sin contacto"}</span><br>
      <input class="input muni" id="m${r.id}" placeholder="código DANE si falta" value="${r.muni_code ?? ""}" />
      <button class="btn btn-success" onclick="act(${r.id},'verify','m${r.id}')">Verificar</button>
      <button class="btn btn-destructive" onclick="act(${r.id},'reject')">Rechazar</button>
      <button class="btn" onclick="act(${r.id},'resolve')">Resuelta</button>
    </div>`).join("");
}
load();
setInterval(load, 30_000);
</script>
</body>
</html>
